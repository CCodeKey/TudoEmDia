spring.application.name=tudoemdia

# Carrega o .env da raiz do repositório, quando existir.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Sessão expira após 30 minutos sem atividade (RN07)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Produção atrás de um proxy HTTPS (RNF13): cookie só em HTTPS e redirecionamento de HTTP
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.forward-headers-strategy=framework
app.seguranca.exigir-https=${EXIGIR_HTTPS:false}

# Erros nunca expõem stack trace nem detalhes internos
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Anexos e documentos de até 10 MB (RN28, RN50)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.mvc.format.date=iso

# Front-end (CORS e links enviados por e-mail)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Pasta onde ficam anexos e documentos, fora do alcance público (RN53)
app.armazenamento.diretorio=${ARMAZENAMENTO_DIR:uploads}

# E-mail (convites e alertas). Sem MAIL_HOST, as mensagens são apenas registradas no log.
app.email.remetente=${MAIL_FROM:nao-responda@tudoemdia.com.br}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
