server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Anexos e documentos de até 10 MB
    client_max_body_size 11m;

    # API na mesma origem do front: o cookie de sessão funciona sem CORS
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Arquivos com hash no nome podem ficar em cache por muito tempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rotas do React: qualquer outro caminho devolve o index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
